<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <title>Q2 Seatwork 2</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: url(https://images.squarespace-cdn.com/content/v1/664c7ae50eea9c731b37e817/51bf9a1b-c4fc-42b1-abe6-945af52780da/OBMC+MONTESSORI+AN+1+-+AY+2026+FA.jpg);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .background {
            flex: 1;
            padding: 40px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .enrollment-container {
            background-color: rgba(255, 255, 255, 0.85);
            border-radius: 5px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 650px;
            padding: 20px;
            box-sizing: border-box;
            margin: auto;
        }

        h2 {
            text-align: center;
            font-size: 25px;
            margin-bottom: 10px;
            color: white;
        }

        .description {
            text-align: center;
            color: white;
            font-size: 12px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 12px;
            text-align: left;
        }

        .section-title {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: bold;
        }

        .text-input {
            width: 100%;
            padding: 7px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-family: Arial, sans-serif;
            font-size: 12px;
            box-sizing: border-box;
        }

        .form-select {
            font-size: 12px;
            padding: 7px;
        }

        .radio-option,
        .check-option {
            font-size: 12px;
            margin-bottom: 5px;
        }

        .submit-btn {
            display: block;
            margin: 15px auto 0;
            background-color: #0d6efd;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            font-size: 13px;
            cursor: pointer;
        }

        .submit-btn:hover {
            background-color: #0b5ed7;
        }

        .footer {
            background-color: #212529;
            color: white;
            padding: 9px;
            margin-top: 20px;
            font-size: 12px;
            max-width: 600px;
            width: 90%;
            margin-left: auto;
            margin-right: auto;
            text-align: center;
            border-radius: 8px;
            font-weight: bold;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRhGWMliic2yX4A8KaM5AP99wxYDDubpMTUsDhyHWKdYmoUUNZZYomypEc&s=10"
                alt="OBMC Logo"
                style="width:35px; height:35px; border-radius:50%;">
            </a>
            <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse" data-bs-target="#collapsibleNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="collapsibleNavbar">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="#">Enroll Now</a>
                    </li>
                </ul>
            </div>
            <form class="d-flex">
                <input class="form-control me-2" type="search" placeholder="Search">
                <button class="btn btn-primary" type="button">Search</button>
            </form>
        </div>
    </nav>
    <div class="background">
        <div class="container">
            <h2>OBMC Student Enrollment Form</h2>
            <p class="description">
                Fill out the form below to enroll for the upcoming school year.
            </p>
            <div class="row justify-content-center">
                <div class="col-md-10 col-lg-8">
                    <div class="enrollment-container">
                        <form>
                            <div class="form-group">
                                <label class="section-title">Student Information</label>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label class="section-title">First Name</label>
                                        <input type="text" placeholder="Enter first name" class="text-input" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label class="section-title">Last Name</label>
                                        <input type="text" placeholder="Enter last name" class="text-input" required>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-4">
                                    <div class="form-group">
                                        <label class="section-title">Birth Date</label>
                                        <input type="date" class="text-input" required>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="form-group">
                                        <label class="section-title">Gender</label>
                                        <select class="form-select" required>
                                            <option value="" selected disabled>Select...</option>
                                            <option>Male</option>
                                            <option>Female</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="form-group">
                                        <label class="section-title">Grade Level</label>
                                        <select class="form-select" required>
                                            <option value="" selected disabled>Select...</option>
                                           <option>Junior Casa</option>
                                            <option>Junior-Advanced Casa</option>
                                            <option>Advanced Casa</option>
                                            <option>Grade 1</option>
                                            <option>Grade 2</option>
                                            <option>Grade 3</option>
                                            <option>Grade 4</option>
                                            <option>Grade 5</option>
                                            <option>Grade 6</option>
                                            <option>Grade 7</option>
                                            <option>Grade 8</option>
                                            <option>Grade 9</option>
                                            <option>Grade 10</option>
                                            <option>Grade 11</option>
                                            <option>Grade 12</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <hr>
                            <div class="form-group">
                                <label class="section-title">Contact Details</label>
                            </div>
                            <div class="form-group">
                                <label class="section-title">Email Address</label>
                                <input type="email" placeholder="student@example.com" class="text-input" required>
                            </div>
                            <div class="form-group">
                                <label class="section-title">Contact Number</label>
                                <input type="tel" placeholder="0912-345-6789" class="text-input" required>
                            </div>
                            <hr>
                            <div class="form-group">
                                <label class="section-title">Parent/Guardian Information</label>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label class="section-title">Parent/Guardian First Name</label>
                                        <input type="text" placeholder="Enter first name" class="text-input" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label class="section-title">Parent/Guardian Last Name</label>
                                        <input type="text" placeholder="Enter last name" class="text-input" required>
                                    </div>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="section-title">Parent/Guardian Contact Number</label>
                                <input type="tel" placeholder="0912-345-6789" class="text-input" required>
                            </div>
                            <div class="form-group">
                                <label class="section-title">Relationship to Student</label>
                                <select class="form-select" required>
                                    <option value="" selected disabled>Select...</option>
                                    <option>Mother</option>
                                    <option>Father</option>
                                    <option>Guardian</option>
                                    <option>Other</option>
                                </select>
                            </div>
                            <hr>
                            <div class="form-group">
                                <label class="section-title">Health Information</label>
                                <label class="section-title">
                                    Does the student have any allergies?
                                </label>
                                <div class="form-check radio-option">
                                    <input class="form-check-input" type="radio"
                                    name="allergies" id="allergyYes" value="Yes" required>
                                    <label class="form-check-label" for="allergyYes">Yes</label>
                                </div>
                                <div class="form-check radio-option">
                                    <input class="form-check-input" type="radio"
                                    name="allergies" id="allergyNo" value="No">
                                    <label class="form-check-label" for="allergyNo">No</label>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="section-title">If yes, please specify:</label>
                                <textarea placeholder="List any known allergies..."
                                rows="3" class="text-input"></textarea>
                            </div>
                            <hr>
                            <div class="form-group">
                                <label class="section-title">Other Information</label>
                                <label class="section-title">Mode of Learning</label>
                                <div class="form-check radio-option">
                                    <input class="form-check-input" type="radio"
                                    name="learning" id="online" value="Online" required>
                                    <label class="form-check-label" for="online">Online</label>
                                </div>
                                <div class="form-check radio-option">
                                    <input class="form-check-input" type="radio"
                                    name="learning" id="face" value="Face-to-Face">
                                    <label class="form-check-label" for="face">Face-to-Face</label>
                                </div>
                            </div>
                            <div class="form-check check-option">
                                <input class="form-check-input" type="checkbox"
                                id="confirm" required>
                                <label class="form-check-label" for="confirm">
                                    I confirm that the information provided is true and complete.
                                </label>
                            </div>
                            <button type="submit" class="submit-btn">
                                Submit Enrollment
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="footer">
        © 2026 OBMC | Created by Jandi Galvez 9-Jade
    </div>
</body>
</html>
